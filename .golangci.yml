version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # Writes to stdout/stderr/http.ResponseWriter from the CLI and the
      # health/metrics handlers have no actionable failure mode — there is
      # nowhere left to report a failed write to the user's terminal — so
      # the print family is excluded rather than peppered with `_, _ =`.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    # npm packages occasionally ship Go sources (flatted does); they are not ours.
    paths:
      - ui/node_modules
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - ui/node_modules
