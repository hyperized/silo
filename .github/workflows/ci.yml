name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Must satisfy the `go` directive in go.mod (1.25.0). A runner Go older than
  # that makes the toolchain build the module under a mismatched spec (e.g.
  # `go: no such tool "covdata"` under -coverprofile) and makes golangci-lint
  # refuse to run, so keep this in lockstep with go.mod.
  GO_VERSION: "1.25"

jobs:
  test:
    name: test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -timeout 120s -coverprofile=coverage.out ./...

      - name: coverage summary
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # v7 of the action supports golangci-lint v2 (our .golangci.yml is
      # `version: "2"`). Pin the linter to the version we run locally so a new
      # "latest" release built against an older Go can't turn CI red on its own.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  build:
    name: build (binary)
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for `git describe`

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build
        run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: silod-${{ github.sha }}
          path: bin/silod
          retention-days: 7

  publish:
    name: publish (container images)
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to GHCR via GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - image: silod
            dockerfile: ./Dockerfile
          - image: silo-csi
            dockerfile: ./Dockerfile.csi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git describe` yields a real VERSION

      - name: resolve version
        id: version
        # Mirror the Makefile's VERSION so the image-stamped --version matches
        # what `make build` / `make images` produce.
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3 # arm64 emulation for the apk runtime layers

      - uses: docker/setup-buildx-action@v3

      # Authenticate only when we actually push (main + tags). PRs build-validate
      # the image but never push, so they need no registry credentials — which
      # also keeps fork PRs (no access to secrets) working.
      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # main push     -> :edge and :sha-<short>
          # tag vX.Y.Z    -> :X.Y.Z, :X.Y, and :latest (newest release only)
          tags: |
            type=sha,format=short,enable={{is_default_branch}}
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # PRs validate amd64 only (fast); main/tags publish the full manifest.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          # Keep the published manifest to just the real platforms (no
          # unknown/unknown attestation entry); flip to true for SLSA provenance.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
