# Single-node silo for the fastest iteration loop. No peers, no
# observability stack — just one silod, rebuilt and restarted on demand.
#
# Run with `make up-local` from the repo root.

services:
  silod:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: dev
    image: silo/silod:dev
    container_name: silo-local
    restart: "no"
    environment:
      SILO_NODE_ID: silo-local
      SILO_GRPC_ADDR: 0.0.0.0:7000
      SILO_HTTP_ADDR: 0.0.0.0:7080
      SILO_DATA_DIR: /var/lib/silo
      SILO_ENCRYPTION_KEY: "${SILO_ENCRYPTION_KEY:?Run 'make up-local' from the repo root to generate a development encryption key (it writes deploy/.env for you). To run compose directly, set SILO_ENCRYPTION_KEY to a base64-encoded 32-byte value, e.g. with 'openssl rand -base64 32'.}"
      SILO_LOG_LEVEL: ${SILO_LOG_LEVEL:-debug}
      SILO_LOG_FORMAT: text
      # Back up to the local S3 server. Credentials reach the AWS SDK default chain.
      SILO_BACKUP_TARGET: s3://silo-backups/local
      SILO_BACKUP_S3_ENDPOINT: http://s3:9000
      SILO_BACKUP_INTERVAL: ${SILO_BACKUP_INTERVAL:-1h}
      AWS_ACCESS_KEY_ID: "${SILO_S3_ACCESS_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
      AWS_SECRET_ACCESS_KEY: "${SILO_S3_SECRET_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
    ports:
      - "7080:7080"
      - "7000:7000"
    volumes:
      - silo-local-data:/var/lib/silo
    depends_on:
      s3-init:
        condition: service_completed_successfully

  # S3-compatible object storage that silod backs up to. The image name is the
  # only RustFS-specific line: any S3 server that serves the API on port 9000
  # can replace it. Pinned by tag and digest so a re-pushed
  # tag cannot change what runs.
  s3:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: "${SILO_S3_ACCESS_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
      RUSTFS_SECRET_KEY: "${SILO_S3_SECRET_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:${SILO_S3_PORT:-9000}:9000" # S3 API, for `siloctl backup list`
      - "127.0.0.1:${SILO_S3_CONSOLE_PORT:-9001}:9001" # web console at /rustfs/console/
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # s3-init creates the backup bucket and exits. It is idempotent so a restart
  # of the stack does not fail on an existing bucket.
  s3-init:
    image: amazon/aws-cli:2.39.0@sha256:6014c77975a4ae237395924cc821333f20bf87c91964a45dd4ed5f3b13b424f5
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for _ in $$(seq 1 30); do
          out=$$(aws --endpoint-url http://s3:9000 s3api create-bucket --bucket silo-backups 2>&1) && exit 0
          case "$$out" in *BucketAlreadyOwnedByYou*|*BucketAlreadyExists*) exit 0;; esac
          sleep 2
        done
        echo "could not create the silo-backups bucket: $$out" >&2
        exit 1
    environment:
      AWS_ACCESS_KEY_ID: "${SILO_S3_ACCESS_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
      AWS_SECRET_ACCESS_KEY: "${SILO_S3_SECRET_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      s3:
        condition: service_healthy

volumes:
  silo-local-data:
  s3-data:
