# 3-node silo cluster for local development.
#
# Run with `make up` from the repo root, or `docker compose -f deploy/docker-compose.yml up`
# from any directory. The Makefile target sets SILO_ENCRYPTION_KEY for you; running
# compose directly requires SILO_ENCRYPTION_KEY to be set (the .env file in this
# directory will be generated by `make up` on first run).

x-silod: &silod
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      VERSION: dev
  image: silo/silod:dev
  restart: unless-stopped
  environment: &silod-env
    SILO_GRPC_ADDR: 0.0.0.0:7000
    SILO_HTTP_ADDR: 0.0.0.0:7080
    SILO_DATA_DIR: /var/lib/silo
    SILO_ENCRYPTION_KEY: "${SILO_ENCRYPTION_KEY:?Run 'make up' from the repo root to generate a development encryption key (it writes deploy/.env for you). To run compose by hand, set SILO_ENCRYPTION_KEY to a base64-encoded 32-byte value, e.g. with 'openssl rand -base64 32'.}"
    SILO_LOG_LEVEL: ${SILO_LOG_LEVEL:-info}
    SILO_LOG_FORMAT: ${SILO_LOG_FORMAT:-text}
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:7080/healthz"]
    interval: 5s
    timeout: 3s
    retries: 6
    start_period: 5s
  networks:
    - silo

services:
  silo-a:
    <<: *silod
    container_name: silo-a
    environment:
      <<: *silod-env
      SILO_NODE_ID: silo-a
      SILO_SEEDS: silo-b:7000,silo-c:7000
    volumes:
      - silo-a-data:/var/lib/silo
    ports:
      - "7080:7080" # HTTP (healthz, metrics) on the host

  silo-b:
    <<: *silod
    container_name: silo-b
    environment:
      <<: *silod-env
      SILO_NODE_ID: silo-b
      SILO_SEEDS: silo-a:7000,silo-c:7000
    volumes:
      - silo-b-data:/var/lib/silo
    ports:
      - "7081:7080"

  silo-c:
    <<: *silod
    container_name: silo-c
    environment:
      <<: *silod-env
      SILO_NODE_ID: silo-c
      SILO_SEEDS: silo-a:7000,silo-b:7000
    volumes:
      - silo-c-data:/var/lib/silo
    ports:
      - "7082:7080"

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: silo-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - silo

  grafana:
    image: grafana/grafana:11.4.0
    container_name: silo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Host port is configurable via SILO_GRAFANA_PORT (default 3030).
      # macOS commonly has another service on 3000.
      - "${SILO_GRAFANA_PORT:-3030}:3000"
    networks:
      - silo
    depends_on:
      - prometheus

volumes:
  silo-a-data:
  silo-b-data:
  silo-c-data:
  prometheus-data:
  grafana-data:

networks:
  silo:
    driver: bridge
