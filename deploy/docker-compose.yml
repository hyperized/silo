# 3-node silo cluster for local development.
#
# Run with `make up` from the repo root, or `docker compose -f deploy/docker-compose.yml up`
# from any directory. The Makefile target sets SILO_ENCRYPTION_KEY for you; running
# compose directly requires SILO_ENCRYPTION_KEY to be set (the .env file in this
# directory will be generated by `make up` on first run).

x-silod: &silod
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      VERSION: dev
  image: silo/silod:dev
  restart: unless-stopped
  environment: &silod-env
    SILO_GRPC_ADDR: 0.0.0.0:7000
    SILO_BOOTSTRAP_ADDR: 0.0.0.0:7001
    SILO_GOSSIP_ADDR: 0.0.0.0:7100
    SILO_HTTP_ADDR: 0.0.0.0:7080
    # NBD block-device server. Opt-in (off unless SILO_NBD_ADDR is set); the
    # local stack turns it on so `make nbd-demo` can mkfs+mount a volume. It is
    # unauthenticated block I/O, reachable only on the cluster network here.
    SILO_NBD_ADDR: 0.0.0.0:10809
    SILO_DATA_DIR: /var/lib/silo
    # Sharing /var/lib/silo/cluster across nodes via the silo-ca named
    # volume means all three silods load the same CA cert + key, which
    # is what makes cluster-internal mTLS work without an external PKI.
    # SILO_TLS_CA_CERT/_KEY point at that shared location explicitly so
    # the self-mint-on-first-boot logic produces the CA in the shared
    # volume rather than in each node's private data dir.
    SILO_TLS_CA_CERT: /var/lib/silo/cluster/ca.crt
    SILO_TLS_CA_KEY: /var/lib/silo/cluster/ca.key
    SILO_ENCRYPTION_KEY: "${SILO_ENCRYPTION_KEY:?Run 'make up' from the repo root to generate a development encryption key (it writes deploy/.env for you). To run compose by hand, set SILO_ENCRYPTION_KEY to a base64-encoded 32-byte value, e.g. with 'openssl rand -base64 32'.}"
    SILO_LOG_LEVEL: ${SILO_LOG_LEVEL:-info}
    SILO_LOG_FORMAT: ${SILO_LOG_FORMAT:-text}
    # Scrub often in the local stack so re-replication after a node loss is
    # observable within seconds; production paces this much slower.
    SILO_SCRUB_INTERVAL: ${SILO_SCRUB_INTERVAL:-5s}
    # The extent-map scrubber heals idle volumes' metadata after a node loss;
    # pace it fast locally for the same reason as the chunk scrubber above.
    SILO_EXTENT_SCRUB_INTERVAL: ${SILO_EXTENT_SCRUB_INTERVAL:-5s}
    # Chunk GC: sweep often with a short grace locally so orphaned-chunk
    # reclamation is observable within an integration test. Enabled here (it is a
    # dry run by default in production until the live-set computation is trusted).
    SILO_CHUNK_GC_INTERVAL: ${SILO_CHUNK_GC_INTERVAL:-5s}
    SILO_CHUNK_GC_GRACE: ${SILO_CHUNK_GC_GRACE:-10s}
    SILO_CHUNK_GC_ENABLE: ${SILO_CHUNK_GC_ENABLE:-true}
    # Back up to the local S3 server. Credentials reach the AWS SDK default chain.
    SILO_BACKUP_TARGET: s3://silo-backups/cluster
    SILO_BACKUP_S3_ENDPOINT: http://s3:9000
    SILO_BACKUP_INTERVAL: ${SILO_BACKUP_INTERVAL:-1h}
    AWS_ACCESS_KEY_ID: "${SILO_S3_ACCESS_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
    AWS_SECRET_ACCESS_KEY: "${SILO_S3_SECRET_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:7080/healthz"]
    interval: 5s
    timeout: 3s
    retries: 6
    start_period: 5s
  networks:
    - silo

services:
  silo-a:
    <<: *silod
    container_name: silo-a
    environment:
      <<: *silod-env
      SILO_NODE_ID: silo-a
      # Bind on 0.0.0.0 (default in *silod-env) but advertise the
      # routable container hostname so peers learn the right dial
      # address instead of "0.0.0.0:7100".
      SILO_GOSSIP_ADVERTISE: silo-a:7100
      # The bootstrap and gRPC advertise values are the operator-facing
      # dial targets. silo-a is the only node that publishes its
      # bootstrap and gRPC ports to the host, so it advertises 127.0.0.1
      # back through the Join response — operators run siloctl from the
      # docker host, not from inside the cluster network.
      SILO_BOOTSTRAP_ADVERTISE: 127.0.0.1:7001
      # Host port is configurable via SILO_GRPC_HOST_PORT (default 7900).
      # macOS reserves 7000 for AirPlay Receiver, so the cluster's gRPC
      # data plane gets a different host-side port; the container still
      # listens on 7000 internally.
      SILO_GRPC_ADVERTISE: 127.0.0.1:${SILO_GRPC_HOST_PORT:-7900}
      # Peers replicate over the bridge network, where this node is reached
      # as silo-a:7000 — distinct from the 127.0.0.1 host route operators
      # use above. Each node advertises its own peer data address so the
      # others learn a routable replication target via gossip.
      SILO_GRPC_PEER_ADVERTISE: silo-a:7000
      # Seeds point at peer gossip listeners (port 7100), not the gRPC
      # data port — gossip is the membership channel.
      SILO_SEEDS: silo-b:7100,silo-c:7100
      # silo-a is the implicit CA seed: it mints the cluster CA into
      # the shared volume on first boot. silo-b and silo-c wait for
      # silo-a's healthcheck to pass before they start, by which time
      # the CA is already on disk.
      SILO_TLS_CA_SEED: "1"
      # `make nbd-demo` sets this to 1 so silo-a always prints a fresh
      # bootstrap token (even on a cluster that has already booted), giving
      # the demo a token to scrape without tearing the cluster down.
      SILO_PRINT_BOOTSTRAP_TOKEN: "${SILO_PRINT_BOOTSTRAP_TOKEN:-}"
    volumes:
      - silo-a-data:/var/lib/silo
      - silo-ca:/var/lib/silo/cluster
    ports:
      - "7080:7080" # HTTP (healthz, metrics) on the host
      - "7001:7001" # Bootstrap join API — point siloctl auth init here
      - "${SILO_GRPC_HOST_PORT:-7900}:7000" # mTLS gRPC — siloctl chunk … goes here after auth init
      - "${SILO_NBD_HOST_PORT:-10809}:10809" # NBD — a Linux host can nbd-client this directly
    depends_on:
      s3-init:
        condition: service_completed_successfully

  silo-b:
    <<: *silod
    container_name: silo-b
    environment:
      <<: *silod-env
      SILO_NODE_ID: silo-b
      SILO_GOSSIP_ADVERTISE: silo-b:7100
      SILO_GRPC_PEER_ADVERTISE: silo-b:7000
      SILO_SEEDS: silo-a:7100,silo-c:7100
    volumes:
      - silo-b-data:/var/lib/silo
      - silo-ca:/var/lib/silo/cluster
    ports:
      - "7081:7080"
      # silo-b's mTLS gRPC, published so an operator (or a demo) can talk to
      # a second node directly and watch namespace mutations converge.
      - "7901:7000"
    depends_on:
      s3-init:
        condition: service_completed_successfully
      silo-a:
        condition: service_healthy

  silo-c:
    <<: *silod
    container_name: silo-c
    environment:
      <<: *silod-env
      SILO_NODE_ID: silo-c
      SILO_GOSSIP_ADVERTISE: silo-c:7100
      SILO_GRPC_PEER_ADVERTISE: silo-c:7000
      SILO_SEEDS: silo-a:7100,silo-b:7100
    volumes:
      - silo-c-data:/var/lib/silo
      - silo-ca:/var/lib/silo/cluster
    ports:
      - "7082:7080"
    depends_on:
      s3-init:
        condition: service_completed_successfully
      silo-a:
        condition: service_healthy

  # nbd-demo is a one-shot privileged Linux container that proves the block
  # surface end to end: it claims credentials, creates a volume, attaches it
  # over NBD, mkfs+mounts it, writes and reads a file, and re-attaches to show
  # the data persists. It is gated behind the "demo" profile so it never runs
  # on `make up`; drive it with `make nbd-demo`, which scrapes the bootstrap
  # token+fingerprint from silo-a's logs and passes them in. Requires a Linux
  # Docker host with the nbd kernel module available (it cannot run against the
  # macOS Docker VM, which lacks /dev/nbd).
  nbd-demo:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deploy/nbd-demo/Dockerfile
    privileged: true
    environment:
      SILO_DEMO_TOKEN: "${SILO_DEMO_TOKEN:-}"
      SILO_DEMO_FP: "${SILO_DEMO_FP:-}"
    networks:
      - silo
    depends_on:
      silo-a:
        condition: service_healthy

  # S3-compatible object storage that silod backs up to. The image name is the
  # only RustFS-specific line: any S3 server that serves the API on port 9000
  # can replace it. Pinned by tag and digest so a re-pushed
  # tag cannot change what runs.
  s3:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: "${SILO_S3_ACCESS_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
      RUSTFS_SECRET_KEY: "${SILO_S3_SECRET_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:${SILO_S3_PORT:-9000}:9000" # S3 API, for `siloctl backup list`
      - "127.0.0.1:${SILO_S3_CONSOLE_PORT:-9001}:9001" # web console at /rustfs/console/
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - silo

  # s3-init creates the backup bucket and exits. It is idempotent so a restart
  # of the stack does not fail on an existing bucket.
  s3-init:
    image: amazon/aws-cli:2.39.0@sha256:6014c77975a4ae237395924cc821333f20bf87c91964a45dd4ed5f3b13b424f5
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for _ in $$(seq 1 30); do
          out=$$(aws --endpoint-url http://s3:9000 s3api create-bucket --bucket silo-backups 2>&1) && exit 0
          case "$$out" in *BucketAlreadyOwnedByYou*|*BucketAlreadyExists*) exit 0;; esac
          sleep 2
        done
        echo "could not create the silo-backups bucket: $$out" >&2
        exit 1
    environment:
      AWS_ACCESS_KEY_ID: "${SILO_S3_ACCESS_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
      AWS_SECRET_ACCESS_KEY: "${SILO_S3_SECRET_KEY:?run 'make down' then 'make up' to regenerate deploy/.env with the backup storage credentials}"
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - silo
    depends_on:
      s3:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: silo-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - silo

  grafana:
    image: grafana/grafana:11.4.0
    container_name: silo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Host port is configurable via SILO_GRAFANA_PORT (default 3030).
      # macOS commonly has another service on 3000.
      - "${SILO_GRAFANA_PORT:-3030}:3000"
    networks:
      - silo
    depends_on:
      - prometheus

volumes:
  silo-a-data:
  silo-b-data:
  silo-c-data:
  # silo-ca holds the cluster CA cert+key and is shared across every
  # node. node silo-a creates it on first boot (self-mint); silo-b and
  # silo-c wait for the seed via depends_on and then load it from disk.
  silo-ca:
  s3-data:
  prometheus-data:
  grafana-data:

networks:
  silo:
    driver: bridge
