    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }

  <body>
    <h1>silo is running</h1>
    <p>This build of silod does not include the web UI. silod itself works normally.</p>
    <p>To get the UI, build it and rebuild silod:</p>
    <pre><code>make ui
make build</code></pre>
    <p>Until then, <code>siloctl status</code> shows the same information on the command line, and
      <a href="/api/v1/status">/api/v1/status</a> serves it as JSON.</p>
  </body>
