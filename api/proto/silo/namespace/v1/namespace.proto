syntax = "proto3";

package silo.namespace.v1;

option go_package = "github.com/hyperized/silo/api/proto/silo/namespace/v1;namespacev1";

// NamespaceStore is silod's operator-facing view of the cluster's CRDT
// filesystem namespace. Mutations are local to the receiving node and
// converge to peers over gossip anti-entropy; reads resolve the receiving
// node's current replica.
service NamespaceStore {
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);
  rpc Touch(TouchRequest) returns (TouchResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  // AppendChunk records a chunk id in a file's manifest. Writers call this
  // after storing the chunk so a reader can later reassemble the file in
  // append (HLC) order.
  rpc AppendChunk(AppendChunkRequest) returns (AppendChunkResponse);
  // Manifest returns a file's chunk ids in the order a reader concatenates
  // them to reconstruct the byte stream.
  rpc Manifest(ManifestRequest) returns (ManifestResponse);
  // CreateVolume creates a block volume: an inode whose data is an extent map
  // backing a fixed-size block device, the surface an NBD client mounts.
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
}

// EntryType distinguishes a directory, a file, and a block volume.
enum EntryType {
  ENTRY_TYPE_DIR = 0;
  ENTRY_TYPE_FILE = 1;
  ENTRY_TYPE_VOLUME = 2;
}

message MkdirRequest {
  string path = 1;
}

message MkdirResponse {
  string inode = 1;
}

message TouchRequest {
  string path = 1;
}

message TouchResponse {
  string inode = 1;
}

message ListRequest {
  string path = 1;
}

// Entry is one resolved child. When concurrent creates collided, the
// highest-HLC claim keeps the bare name and the others carry a
// ".conflict-<hlc>" name with conflict set.
message Entry {
  string name = 1;
  string inode = 2;
  EntryType type = 3;
  bool conflict = 4;
}

message ListResponse {
  repeated Entry entries = 1;
}

message RemoveRequest {
  string path = 1;
}

message RemoveResponse {}

message AppendChunkRequest {
  string path = 1;
  string chunk_id = 2;
}

message AppendChunkResponse {}

message ManifestRequest {
  string path = 1;
}

message ManifestResponse {
  repeated string chunk_ids = 1;
}

message CreateVolumeRequest {
  string path = 1;
  // size_bytes is the advertised block-device size.
  int64 size_bytes = 2;
  // extent_size_bytes is the copy-on-write unit; 0 uses the server default.
  int64 extent_size_bytes = 3;
}

message CreateVolumeResponse {
  string inode = 1;
}
