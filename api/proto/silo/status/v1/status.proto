syntax = "proto3";

package silo.status.v1;

option go_package = "github.com/hyperized/silo/api/proto/silo/status/v1;statusv1";

// ClusterStatus is silod's read-only operator view of cluster health. A node
// answers from its own gossip-derived membership view plus its local storage;
// `siloctl status` renders it. There is no global coordinator, so two nodes may
// briefly report different views during a membership change — that is the
// system working, not a fault.
service ClusterStatus {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

// NodeState mirrors the SWIM membership states.
enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  NODE_STATE_ALIVE = 1;
  NODE_STATE_SUSPECT = 2;
  NODE_STATE_DEAD = 3;
  NODE_STATE_LEFT = 4;
}

// NodeStatus is one member as the responding node currently sees it.
message NodeStatus {
  string id = 1;
  string gossip_address = 2;
  string data_address = 3;
  NodeState state = 4;
  uint64 incarnation = 5;
  // last_change_unix is the epoch-seconds of this node's last state transition;
  // the CLI renders it as an age ("down for 2m").
  int64 last_change_unix = 6;
  // capacity_bytes and used_bytes are the node's advertised backing-store size
  // and usage (zero until the node has advertised them over gossip).
  int64 capacity_bytes = 7;
  int64 used_bytes = 8;
  // pressured is set when the node advertised its DiskPressure condition (the
  // soft high-watermark). Only meaningful once capacity_bytes is non-zero.
  bool pressured = 9;
  // clock_skew_ms is the responding node's last measured wall-clock skew to
  // this peer, in milliseconds; positive means the peer's clock is ahead. It
  // includes one-way gossip latency. 0 for the responding node itself and for
  // a peer with no recent reading.
  int64 clock_skew_ms = 10;
}

// ClusterHealth is the responding node's own health signals: what it was
// configured for, how much of the cluster it can see, and its clock.
message ClusterHealth {
  // replication_factor is SILO_REPLICATION as configured on the responding node.
  int32 replication_factor = 1;
  // alive_nodes counts members in NODE_STATE_ALIVE, the responding node included.
  int32 alive_nodes = 2;
  // isolated is set while the node sees fewer alive peers than it needs and is
  // retrying its seeds (the silo_gossip_isolated gauge).
  bool isolated = 3;
  // rejoin_attempts counts seed dials made to get back into the cluster after
  // losing peers (silo_gossip_rejoin_attempts_total).
  uint64 rejoin_attempts = 4;
  // clock_skew_ms is the largest absolute skew to any peer with a recent
  // reading, in milliseconds (the same readings as silo_hlc_peer_clock_skew_seconds).
  int64 clock_skew_ms = 5;
  // clock_skew_alerts counts readings that exceeded SILO_MAX_CLOCK_SKEW
  // (silo_hlc_clock_skew_alerts_total).
  uint64 clock_skew_alerts = 6;
  // started_unix is when the responding silod process started.
  int64 started_unix = 7;
}

// GCStatus is the responding node's chunk garbage collector.
message GCStatus {
  // enabled is false when SILO_CHUNK_GC_ENABLE is off: sweeps still run and
  // count orphans but delete nothing.
  bool enabled = 1;
  bool running = 2;
  // last_run_unix is 0 when no sweep has finished since the process started.
  int64 last_run_unix = 3;
  int64 last_duration_ms = 4;
  int64 last_orphans_deleted = 5;
  int64 last_bytes_freed = 6;
  // last_error is empty when the last sweep completed; otherwise it says why
  // the sweep stopped or abstained. Abstentions start with "skipped: ".
  string last_error = 7;
  // consecutive_skips is how many sweeps in a row have abstained. It returns
  // to 0 when a sweep completes.
  int64 consecutive_skips = 8;
}

// StorageStatus is the responding node's local backing storage.
message StorageStatus {
  string data_dir = 1;
  int64 capacity_bytes = 2;
  int64 used_bytes = 3;
  int64 available_bytes = 4;
  int64 chunk_count = 5;
}

// VolumeStatus is one volume as the responding node's namespace replica sees it.
message VolumeStatus {
  string path = 1;
  string inode = 2;
  int64 size_bytes = 3;
  int64 extent_size_bytes = 4;
  // lease_holder is the writer currently attached, or empty when none.
  string lease_holder = 5;
  // extents_written counts extents that hold data; extents_written × extent_size_bytes
  // approximates the bytes actually allocated.
  int64 extents_written = 6;
  // replicas are the node ids that hold this volume's extent-map replica set,
  // as the responding node's placement ring resolves it now.
  repeated string replicas = 7;
  // map_damaged is set when the responding node found its copy of the volume's
  // extent map damaged at startup and has not rebuilt it from the replicas yet.
  bool map_damaged = 8;
  // attached_here is set while an NBD client has the volume open on the
  // responding node.
  bool attached_here = 9;
}

message GetStatusResponse {
  string responding_node_id = 1;
  string version = 2;
  repeated NodeStatus nodes = 3;
  StorageStatus storage = 4;
  BackupStatus backup = 5;
  repeated VolumeStatus volumes = 6;
  ClusterHealth health = 7;
  GCStatus gc = 8;
}

// BackupStatus is the responding node's backup configuration and the outcome
// of its most recent run. Unconfigured nodes report configured=false.
message BackupStatus {
  bool configured = 1;
  // target is the destination URL without credentials, e.g. s3://bucket/prefix.
  string target = 2;
  int64 interval_seconds = 3;
  // next_run_unix is 0 when no run is scheduled.
  int64 next_run_unix = 4;
  bool running = 5;
  // last_run is unset until a run has finished.
  BackupRun last_run = 6;
}

message BackupRun {
  int64 started_unix = 1;
  int64 finished_unix = 2;
  bool ok = 3;
  // error is empty when ok; otherwise it tells the operator what to do next.
  string error = 4;
  int64 chunks_uploaded = 5;
  // chunks_skipped were already present on the target.
  int64 chunks_skipped = 6;
  int64 bytes_uploaded = 7;
  // manifest is the object key of the manifest this run wrote.
  string manifest = 8;
}
